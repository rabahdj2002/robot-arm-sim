<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Arm Kinematics Simulator — DH FK/IK</title>
  <meta name="description" content="Interactive robot arm simulator: define joints, compute Denavit–Hartenberg forward kinematics and numerical inverse kinematics in real time.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦾</text></svg>">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header>
    <div class="title">
      <h1>Robot Arm Kinematics Simulator</h1>
      <span class="sub">Denavit–Hartenberg · Forward + Inverse Kinematics · Real-time DOF</span>
    </div>
    <label class="toggle"><input id="frames-toggle" type="checkbox" checked> Frame axes</label>
  </header>
  <main>
    <aside id="panel"></aside>
    <canvas id="viewport"></canvas>
  </main>
  <footer>
    <span>Standard DH convention: Rot<sub>z</sub>(θ)·Trans<sub>z</sub>(d)·Trans<sub>x</sub>(a)·Rot<sub>x</sub>(α) — IK via damped least squares on the position Jacobian</span>
    <a href="https://github.com/rabahdj2002/robot-arm-sim" target="_blank" rel="noopener">Source</a>
  </footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
