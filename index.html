<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot Arm Kinematics Simulator — DH FK/IK</title>
  <meta name="description" content="Interactive robot arm simulator: define joints, compute Denavit–Hartenberg forward kinematics and numerical inverse kinematics in real time.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2.2">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦾</text></svg>">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
        "./js/dh.js": "./js/dh.js?v=2.2",
        "./js/ik.js": "./js/ik.js?v=2.2",
        "./js/arm.js": "./js/arm.js?v=2.2",
        "./js/ui.js": "./js/ui.js?v=2.2",
        "./js/collision.js": "./js/collision.js?v=2.2",
        "./js/config.js": "./js/config.js?v=2.2",
        "./js/workspace.js": "./js/workspace.js?v=2.2",
        "./js/trajectory.js": "./js/trajectory.js?v=2.2"
      }
    }
  </script>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="6" cy="19" r="2.5"/><path d="M8 17.5 12 9"/><circle cx="12.5" cy="7.5" r="2"/>
          <path d="M14 6.5 18.5 3.5"/><circle cx="20" cy="3" r="1.4"/>
          <path d="M3.5 19h5" opacity=".5"/>
        </svg>
      </div>
      <div class="titles">
        <h1>Robot Arm Kinematics</h1>
        <span class="sub">Denavit–Hartenberg · FK / IK · real-time collisions</span>
      </div>
    </div>
    <div class="hctrl">
      <label class="switch"><input id="frames-toggle" type="checkbox" checked><span>Frames</span></label>
      <button id="reset-view" class="ghost">Reset view</button>
    </div>
  </header>
  <main>
    <aside id="panel"></aside>
    <div class="viewport-wrap">
      <canvas id="viewport"></canvas>
      <div class="hud hud-tl">
        <div class="hud-chip"><span class="lbl">DOF</span><b id="hud-dof">–</b></div>
        <div class="hud-chip"><span class="lbl">EE&nbsp;m</span><span id="hud-ee" class="mono">·</span></div>
      </div>
      <div class="hud hud-bl">drag ball&nbsp;·&nbsp;move target&nbsp;&nbsp;&nbsp;drag&nbsp;·&nbsp;orbit&nbsp;&nbsp;&nbsp;scroll&nbsp;·&nbsp;zoom&nbsp;&nbsp;&nbsp;right-drag&nbsp;·&nbsp;pan</div>
    </div>
  </main>
  <footer>
    <span>Standard DH: Rot<sub>z</sub>(θ)·Trans<sub>z</sub>(d)·Trans<sub>x</sub>(a)·Rot<sub>x</sub>(α) — IK: damped least-squares + CCD restarts</span>
    <span>v2.2 · <a href="https://github.com/rabahdj2002/robot-arm-sim" target="_blank" rel="noopener">Source</a></span>
  </footer>
  <script type="module" src="js/main.js?v=2.2"></script>
</body>
</html>
